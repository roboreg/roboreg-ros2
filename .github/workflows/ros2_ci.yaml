name: ROS 2 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  jazzy:
    name: jazzy
    runs-on: ubuntu-latest
    steps:
      - name: Setup ROS
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - name: Colcon Build & Test
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          import-token: ${{ secrets.GITHUB_TOKEN }}
          target-ros2-distro: jazzy
          colcon-defaults: |
            {
                "test": {
                    "pytest-args": [
                        "-m not linter"
                    ]
                }
            }

  lyrical:
    name: lyrical
    runs-on: ubuntu-latest
    steps:
      - name: Setup ROS
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: lyrical
      - name: Colcon Build & Test
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          import-token: ${{ secrets.GITHUB_TOKEN }}
          target-ros2-distro: lyrical
          colcon-defaults: |
            {
                "test": {
                    "pytest-args": [
                        "-m not linter"
                    ]
                }
            }

  rolling:
    name: rolling
    runs-on: ubuntu-latest
    steps:
      - name: Setup ROS
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: rolling
      - name: Colcon Build & Test
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          import-token: ${{ secrets.GITHUB_TOKEN }}
          target-ros2-distro: rolling
          colcon-defaults: |
            {
                "test": {
                    "pytest-args": [
                        "-m not linter"
                    ]
                }
            }
