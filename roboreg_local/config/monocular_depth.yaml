/**/roboreg_monocular_local:
  ros__parameters:
    topics:
      image:
        name: /camera/image_rect_color
        qos:
          reliability: BEST_EFFORT
          durability: VOLATILE
        camera_info:
          name: /camera/camera_info
          qos:
            reliability: BEST_EFFORT
            durability: VOLATILE
      depth:
        name: /camera/depth/registered
        qos:
          reliability: BEST_EFFORT
          durability: VOLATILE
        camera_info:
          name: /camera/depth/registered/camera_info
          qos:
            reliability: BEST_EFFORT
            durability: VOLATILE
      joint_state:
        name: /joint_states
        qos:
          reliability: BEST_EFFORT
          durability: VOLATILE
      robot_description:
        name: /robot_description
        qos:
          reliability: RELIABLE
          durability: TRANSIENT_LOCAL

    filters:
      sync_accuracy: 0.1

    annotation:
      n_positive: 5
      n_negative: 5

    segmentation:
      device: cuda
      model_id: facebook/sam2-hiera-large
      pth: 0.5

    robot_data:
      root_link_name: ""
      end_link_name: ""
      collision_meshes: False

    tf_broadcaster:
      parent_frame: world
      child_frame: camera_frame
      target_child_frame: camera_link
