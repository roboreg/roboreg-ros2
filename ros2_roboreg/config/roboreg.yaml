/**/roboreg:
  ros__parameters:
    filters:
      sync_accuracy: 1.0
      min_joint_position_change: 0.001
      max_joint_velocity: 0.01

    topics:
      camera_info:
        left:
          name: /left/camera_info
          qos_reliability: BEST_EFFORT # loaded through getattr. From: [SYSTEM_DEFAULT, BEST_EFFORT, RELIABLE]
        right:
          name: /right/camera_info
          qos_reliability: BEST_EFFORT
      image:
        left:
          name: /left/image_rect_color
          qos_reliability: BEST_EFFORT
        right:
          name: /right/image_rect_color
          qos_reliability: BEST_EFFORT
      joint_state:
        name: /joint_states
        qos_reliability: BEST_EFFORT
      depth:
        name: /depth/registered
        qos_reliability: BEST_EFFORT
      robot_description:
        name: /robot_description

    segmentation:
      device: cuda
      n_positive_samples: 5
      n_negative_samples: 5
      model_id: facebook/sam2-hiera-large
      pth: 0.5

    robot_model:
      device: cuda
      root_link_name: ""
      end_link_name: ""
      visual_meshes: False

    tf_broadcaster:
      parent_frame: world
      child_frame: camera_frame
      target_child_frame: camera_link
