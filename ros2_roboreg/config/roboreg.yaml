/**/roboreg:
  ros__parameters:
    filters:
      sync_accuracy: 1.0
      min_joint_position_change: 0.001
      max_joint_velocity: 0.01

    topics:
      image:
        name: /image_rect_color
        qos_reliability: BEST_EFFORT # loaded through getattr. From: [SYSTEM_DEFAULT, BEST_EFFORT, RELIABLE]
      camera_info:
        name: /camera_info
        qos_reliability: BEST_EFFORT
      joint_state:
        name: /joint_states
        qos_reliability: BEST_EFFORT
      depth:
        name: /depth/registered
        qos_reliability: BEST_EFFORT
      robot_description:
        name: /robot_description

    segmentation:
      device: cuda
      n_positive_samples: 5
      n_negative_samples: 5
      model_id: facebook/sam2-hiera-large
      pth: 0.5

    robot_model:
      device: cuda
      root_link_name: ""
      end_link_name: ""
      visual_meshes: False

    registration:
      hydra_icp:
        erosion_kernel_size: 10
        number_of_points: 5000
        max_distance: 0.1
        outer_max_iter: 100
        inner_max_iter: 3
        rmse_change: 1.0e-6
      stereo_dr:
        optimizer: SGD
        lr: 0.001
        epochs: 100
        step_size: 100
        gamma: 1.0

    tf_broadcaster:
      parent_frame: world
      child_frame: camera_frame
      target_child_frame: camera_link
